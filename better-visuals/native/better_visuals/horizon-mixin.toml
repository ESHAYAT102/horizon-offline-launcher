[mod]
id = "horizon_better_visuals"
version = "0.1.3"
priority = 100

[compatibility]
horizon_revision = "efc875c37e174ac27cebb712c2449c0fdc17a484"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "better_visuals_native"
